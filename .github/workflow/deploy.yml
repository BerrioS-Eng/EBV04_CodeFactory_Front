name: Build, Test and Deploy

on:
  push:
    branches:
      - build
      - main
      - develop
  pull_request:
    branches:
      - build
      - main
      - develop

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      # 1. Checkout del código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4. Linting
      - name: Run ESLint
        run: npm run lint

      # 5. Test unitarios
      - name: Run unit tests
        run: npm test -- --coverage

      # 6. Upload coverage reports
      - name: Upload coverage to Codecov
        if: matrix.node-version = '20.x' 
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

      # 7. Build
      - name: Build Next.js project
        run: npm run build

      # 8. Deploy a Vercel (solo en push a main)
      - name: Deploy to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: vercel/action@v6
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          production: true

      # 9. Deploy preview (en pull requests)
      - name: Deploy Preview to Vercel
        if: github.event_name == 'pull_request'
        uses: vercel/action@v6
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

      # 10. Comentar el PR con los resultados
      - name: Comment PR with deployments info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Build successful! Preview deployment ready.'
            })