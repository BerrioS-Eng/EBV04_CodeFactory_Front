name: Build, Test and Deploy

on:
  push:
    branches:
      - build
  pull_request:
    branches:
      - build

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      # 1. Checkout del código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Instalar pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 3. Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # 4. Instalar dependencias
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Linting
      - name: Run ESLint
        run: pnpm lint

      # 6. Test unitarios
      - name: Run unit tests
        run: pnpm test -- --coverage

      # 7. Upload coverage reports
      - name: Upload coverage to Codecov
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

      # 8. Build
      - name: Build Next.js project
        run: pnpm build

      # 8. Deploy a Vercel (solo en push a main)
      - name: Deploy to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/build'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          production: true

      # 9. Deploy preview (en pull requests)
      - name: Deploy Preview to Vercel
        if: github.event_name == 'pull_request'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

      # 10. Comentar el PR con los resultados
      - name: Comment PR with deployments info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Build successful! Preview deployment ready.'
            })